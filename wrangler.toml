# App config for the Mac runner (`wrangler dev --local`, see docs/mac-runner.md) and D1 commands only.
# The public `portfolio` Worker is the proxy in proxy/wrangler.toml; `npm run deploy` builds the approved bundle
# for the Mac and deploys that proxy. Never `wrangler deploy` this file: the app would run against the frozen
# remote D1, exceed the free CPU limit, and sit on a workers.dev host without Cloudflare Access. The name differs
# from `portfolio` so a mistaken deploy cannot overwrite the proxy.
name = "portfolio-mac-app"
main = "dist/server/index.js"
no_bundle = true
compatibility_date = "2026-10-01"

# App settings live in `~/committee-runner/.dev.vars` (operator-owned regular file, mode 0600).
# Enter them manually per docs/cloud-review-setup.md, never via `wrangler secret put`; restart the Mac runner
# after changes. Values never live in this file:
# ACCESS_TEAM_DOMAIN, ACCESS_AUD, OWNER_EMAIL, ACCESS_SERVICE_ID, CLAUDE_REVIEW_PUBLIC_KEY,
# CLOUD_REVIEW_ENABLED (false until genuine auth/proof verification), CLOUD_REVIEW_REPOSITORY,
# CLOUD_REVIEW_REF, CLOUD_REVIEW_DISPATCH_TOKEN, CLOUD_REVIEW_PUBLIC_KEY,
# DART_API_KEY, EDINET_API_KEY, FRED_API_KEY, SEC_USER_AGENT, TYPESAFE_API_KEY.
# Do not set AUTH_PROVIDER=sites on Cloudflare; that mode trusts the Sites dispatch boundary that does not exist here.

[[d1_databases]]
binding = "DB"
database_name = "committee-lab"
database_id = "<your-d1-database-id>"
migrations_dir = "drizzle"

[observability]
enabled = true
